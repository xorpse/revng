[package]
name = "revng-rust-inkwell-lifter-example"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "revng-rust-inkwell-lifter-example"
path = "src/main.rs"

[[bin]]
name = "revng-rust-decompile-example"
path = "src/bin/decompile.rs"

[dependencies]
cxx = "1"
inkwell = { version = "0.9", default-features = false, features = ["llvm16-0-no-llvm-linking", "target-x86"] }
revng-inkwell = { path = "../../rust/revng-inkwell" }
revng-sys = { path = "../../rust/revng-sys" }

[build-dependencies]
cc = "1"
cxx-build = "1"
revng-build = { path = "../../rust/revng-build" }
